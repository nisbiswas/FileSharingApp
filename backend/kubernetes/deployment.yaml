apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: upload-pvc 
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests: 
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: filesharing-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000  
          volumeMounts:
            - name: upload-storage 
              mountPath: /app/uploads
          startupProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
              httpGet:
                path: /status
                port: 8000
              initialDelaySeconds: 5
              periodSeconds: 10
          readinessProbe:
              httpGet: 
                path: /ready
                port: 8000
              initialDelaySeconds: 5
              periodSeconds: 10  
      volumes:
        - name: upload-storage
          persistentVolumeClaim:
            claimName: upload-pvc

---
apiVersion: v1 
kind: Service
metadata:
  name: app
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
